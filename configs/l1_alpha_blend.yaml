# L1: Alpha Blend Activation — Soft Innovation Blending  [REJECTED ❌]
#
# Kaizen Trial | 2026-04-27 | Baseline: i12 + T1  IMM=0.7094  Delta=+0.0006
# REJECT: k_conf=5.0 → bike5=-0.015, uav1 canary=-0.038. Accumulated lag.
#
# Motivasyon:
#   _compute_update_alpha() k_conf=0 AND lambda=0 → daima 1.0 döner → NOP.
#   i12 config'de soft_fusion section yok → alpha blending hiç etkinleşmemiş.
#
#   z_soft = predicted + alpha * innov
#   alpha=1.0 (binary gate): ya tam güncelleme ya da red
#   alpha<1.0 (yumuşak): düşük-conf veya yüksek-Mahanobis algıları KF'e kısmen yazılır.
#
# L1 Parametreleri:
#   k_conf=5.0:   sigmoid slope — conf=0.74'te α≈0.77, conf=0.5'te α≈0.50, conf=0.3'te α≈0.12
#   lambda=0.3:   Mahalanobis suppression — d2=chi2_max'ta exp(-0.3)≈0.74 azalma
#
#   Singer escape hatch mevcut: singer_prob > 0.40 → alpha = max(alpha, singer_prob)
#   → gerçek manevralarda alpha düşmez.
#
# Canary target sequences:
#   truck1:  T1 koruması — scale-collapse guard bozulmamalı (delta≈0)
#   uav1:    IMM'in gerçek kazandığı seq — delta=+0.041 korunmalı
#   bike5:   IMM gerçek kazanç — delta=+0.014 korunmalı
#   bus2-n:  Küçük IMM kaybı — delta=-0.012, blending düzeltmeli
#
# Karar kriteri:
#   |delta(l1) - delta(i12+T1)| > +0.001 → KABUL
#   |delta(l1) - delta(i12+T1)| ∈ [-0.001, +0.001] → GÖZLE (Optuna ile rafine et)
#   delta(l1) < delta(i12+T1) - 0.002 → RED


# G1B: Lower conf_refresh_high Config
# Hypothesis: bike3 cascade starts when conf ~0.55 (above 0.50) enters [0.35, 0.65].
# Fix: lower CONF_REFRESH_HIGH from 0.65 → 0.50 so the Faz D streak only forms
#      when confidence is in [0.35, 0.50]. bike3 starts at ~0.55 → streak never forms
#      in the 0.50-0.65 zone. air_cond/truck_night operate at conf < 0.50 so still rescued.
# Test: python3 scripts/ab_test.py --mode ai_lead --gmc --adaptive-r --imm-config configs/g1b_lower_high.yaml
# Expected: bike3 dAUC improves (closer to 0) while air_cond/truck_night still rescued.
# If FinalScore > 0.7140 → merge conf_refresh_high: 0.50 into imm_tuned.yaml
# G1A ref:   FinalScore(IMM)=0.6808,  bike3 dAUC≈0.000 (no refresh at all)
# Baseline:  FinalScore(IMM)≈0.7140,  bike3 dAUC=-0.407

imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.740469
  innovation_threshold: 1.454772
  sm_conf_threshold: 0.155357
  sm_max_coast: 69
  maneuver_threshold: 0.40
  maneuver_bypass_boost: 0.10

adaptive_r:
  enabled: true
  floor: 0.01
  r_exponent: 2.0

singer:
  alpha: 1.0
  sigma2_a: 25.0

mahalanobis:
  chi2_threshold: 23.51
  bypass_after: 2
  r_pos_base: 44.953786
  r_size_base: 21.07025

ai:
  skip_when_confident: false
  max_consecutive_skips: 2
  singer_skip_thr: 0.35
  cv_stable_thr: 0.70
  cv_conf_min: 0.65
  search_scale_boost: 0.0
  conf_refresh_low:   0.35
  # G1B: Lowered from 0.65 → 0.50.
  # bike3 cascade: conf starts at ~0.55 (above 0.50) → streak zone never entered → no cascade.
  # air_cond/truck_night rescue: conf typical range 0.35-0.48 → inside [0.35, 0.50] → still rescued.
  conf_refresh_high:  0.50
  refresh_patience:   8
  refresh_decline_thr: 0.04
  refresh_min_bbox_area: 0.0

# N3: F5 ObsSize — KF Konum + AI Boyutu Arama Penceresi
#
# Kaizen Trial | 2026 | Baseline: i12 IMM=0.7139 (255-seq)
#
# Hipotez:
#   car6 (genişlik 45-398px, std=84.7px): KF boyutu gerçek boyutun gerisinde kalır.
#   f5_feedback set_state(kf_output) → arama penceresi yanlış ölçekli → AI düşük IoU.
#   Düzeltme: set_state için KF KONUMU + AI gözlem BOYUTU kullan.
#   → Arama penceresi doğru boyutlandırılır, KF konum hassasiyeti korunur.
#
# Beklenen kazanım:
#   car6: -0.021 regresyon → 0.000 (veya yakını)
#   building2: -0.013 → 0.000 (veya yakını)
#   truck_night / aircon_box2: değişmez (coast=f5 devre dışı, küçük hedef muaf)
#
# NOT: Bu düzeltme sadece ai_lead modunda etkilidir (run_competition.py hardcode ai_lead).
#      baseline mod (ab_test varsayılan) choose_search_bbox pred_bbox kullanır —
#      orada etkisi yoktur, ama regresyon riski de sıfırdır.

imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.740469
  coast_threshold: 0.140301
  bypass_after_fast: 2
  bypass_after_slow: 5
  bypass_conf_thr: 0.70
  bypass_vel_thr: 3.0
  mahal_chi2_threshold: 23.51
  r_exponent: 2.0
  adaptive_r: true

regime_adaptive: false

gmc:
  enabled: false
  method: ecc
  min_inliers: 20
  max_rot_deg: 3.0

ai:
  kf_mode: ai_lead
  search_scale_boost: 0.0
  maneuver_pi_enabled: false
  refresh_patience: 8
  refresh_decline_thr: 0.04
  refresh_bypass_lookback: 0
  refresh_min_bbox_area: 0.0
  refresh_min_interval: 0
  refresh_small_area_thr: 220.0
  refresh_small_interval: 99999
  rescue_min_area: 220.0
  f5_feedback: true
  f5_scale_guard: 1.5
  # F5-ObsSize: use AI obs size + KF position to avoid KF size-lag regression
  # car6: width 45-398px, KF size lags → wrong search window scale → lower IoU
  f5_obs_size: true

oru:
  enabled: true
  n_min: 5
  n_max: 30
  conf_reentry_min: 0.50
  velocity_cv_max: 0.5
  virtual_conf: 0.4
  skip_if_singer_dom: true
  singer_dom_thr: 0.7
  ring_buffer_size: 35

chaos:
  enabled: false
  window: 10
  chaos_thr: 0.08
  chaos_max: 0.20
  min_chaos_conf_factor: 0.15

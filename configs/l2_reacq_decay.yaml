# L2: Reacquisition R-Inflation — Post-Coast R Smoothing  [REJECTED ❌]
# REJECT: reacq_r_decay=0.2 → uav1 canary -0.064, bus2-n -0.045.
# R_factor=7x for 83-frame coast → eff_conf/2.65 → near-zero KF update after absence.
#
# Kaizen Trial | 2026-04-27 | Baseline: i12 + T1  IMM=0.7094  Delta=+0.0006
#
# Motivasyon:
#   uav1: 5 occlusion run (14-83 frame, toplam 217/3469=%6.2).
#   Hedef kaybolduktan sonra tekrar görününce, IMM coastinge girer sonra reacq.
#   İlk güncelleme noisy ise (büyük d2), KF state bozulabilir.
#   reacq_r_decay > 0: R = R * (1 + decay * min(coast_count, 30))
#   → Coast uzunsa, ilk güncellemenin R'ı şişer → KF yavaş yakınsar (overcorrect yok).
#
# Parametreler:
#   reacq_r_decay=0.2: R_factor = 1 + 0.2 * min(coast, 30)
#     Kısa coast (1 frame): R_factor=1.2 → %20 şişme → ihmal edilebilir
#     Uzun coast (83 frame): R_factor = 1 + 0.2*30 = 7.0 → %600 şişme → çok güvenli
#
# Beklentiler:
#   uav1: reacq sonrası daha stabil → IMM delta artabilir (+0.041 → daha fazla?)
#   Kısa coast (0-2 frame) olan seqlarda: ihmal edilebilir etki
#   Uzun occlusion seqlarda: potansiyel iyileşme


# K4: Scale Noise — Boyut Hızı İşlem Gürültüsü Düzeltmesi
#
# Kaizen Trial | 2026-04-26 | Baseline: k2_staggered_rescue.yaml IMM=0.6890 (20-seq)
# (k3 REJECTED: r_exponent=1.5 regression Δ=-0.0366)
#
# Sorun (Döngü 1 — Boyut Kayma Döngüsü):
#   Q[6,6] = Q[7,7] = MODEL_Q_BASES[CV][6] × q_scale = 0.0001 × 31.11 = 0.003 px²/frame³
#   Bu değer pratikte 0 — KF, vw ve vh'ı (boyut hızları) neredeyse hiç tahmin edemez.
#   Sonuç: Hedef yaklaşıyor/uzaklaşıyorsa KF bbox'u doğru boyutta güncelleyemiyor.
#   F5 feedback loop bu hatayı AI search window'a geri besliyor → conf düşüşü.
#
#   Mevcut: Q_vw = 0.003 px²/frame³ → vw ≈ sabit (etkin ölü)
#   Yeni:   Q_vw = 0.003 × 50 = 0.155 px²/frame³ → makul boyut hızı gürültüsü
#
# Neden q_size_vel_scale=50?
#   - px/frame cinsinden: sqrt(0.155) ≈ 0.39 px/frame (makul boyut değişim hızı)
#   - Çok düşük (1-10): vw/vh hala ölü
#   - Çok yüksek (100+): KF aşırı dalgalanıyor, smooth tracking bozuluyor
#   - 50 başlangıç noktası: orta-büyük hedefler (çerçeve 640×480, bbox 50×50 px)
#
# Kod değişikliği:
#   scripts/ab_test.py, python/tracker/replay.py, scripts/run_competition.py dosyaları
#   artık `q_size_vel_scale` parametresini okuyor (default=1.0 → backward compat)
#   Q[6,6] *= q_size_vel_scale, Q[7,7] *= q_size_vel_scale (tüm 3 model için)
#
# Riskler:
#   - Daha yüksek Q_vw → KF daha agresif boyut tahmini → bazı sekansda gürültü artabilir
#   - CV model en derinden etkilenir (0.0001→0.005), CA/Singer zaten daha büyük vw_base
#   - Doğrula: car1_s (ölçek değişimi → iyileşmeli), ball2 (sabit ölçek → nötr kalmalı)
#
# Kök: k2_staggered_rescue.yaml üzerine kurulu
#      k3 (r_exponent mutasyonu) REDDEDILDI — bu config i12 R davranışını koruyor
#
# Test: python3 scripts/ab_test.py --mode ai_lead --gmc --adaptive-r \
#          --imm-config configs/k4_scale_noise.yaml
# KABUL kriteri: Δ ≥ 0.0 vs k2 (IMM=0.6890)

imm:
  q_scale: 31.113513
  q_size_vel_scale: 50.0    # MUTATION: Q[vw,vh] indeksleri ×50 → 0.003→0.155 px²/frame³
                             # i12 varsayılanı 1.0'dır; default=1.0 → backward compat
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779
  rescue_streak_threshold: 10   # k2: Stratejik kademelendirme korunuyor

smart_intervention:
  conf_bypass_threshold: 0.740469
  innovation_threshold: 1.454772
  sm_conf_threshold: 0.155357
  sm_max_coast: 69
  maneuver_threshold: 0.40
  maneuver_bypass_boost: 0.10

adaptive_r:
  enabled: true
  floor: 0.01         # i12 orijinali — k3 değişikliği REDDEDILDI
  r_exponent: 2.0     # i12 orijinali — k3 değişikliği REDDEDILDI

singer:
  alpha: 1.0
  sigma2_a: 25.0

mahalanobis:
  chi2_threshold: 23.51
  bypass_after: 5
  bypass_conf_thr: 0.70
  bypass_vel_thr: 3.0
  bypass_after_fast: 2
  bypass_after_slow: 5
  r_pos_base: 44.953786
  r_size_base: 21.07025

ai:
  skip_when_confident: false
  max_consecutive_skips: 2
  singer_skip_thr: 0.35
  cv_stable_thr: 0.70
  cv_conf_min: 0.65
  search_scale_boost: 0.0

  # Faz D: Proactive template refresh
  conf_refresh_low:   0.35
  conf_refresh_high:  0.65
  refresh_patience:   8
  refresh_decline_thr: 0.04
  refresh_bypass_lookback: 0

  # i11: Smart Cooldown
  refresh_min_bbox_area: 0.0
  refresh_min_interval: 0
  refresh_small_area_thr: 220.0
  refresh_small_interval: 99999

  # i12: Great Rescue Area Gate
  rescue_min_area: 220.0

  # F5: Closed-loop feedback
  f5_feedback: true

# C2: C1 + F5 closed-loop feedback (KF predicted bbox steers AI search window).
# This lets KF actually contribute on low-conf frames. Risk: same regression as A1.

f5_feedback: true
f5_coast_only: true   # only apply F5 when reject_streak > 0 (be conservative)

imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.50
  innovation_threshold: 1.454772
  sm_conf_threshold: 0.155357
  sm_max_coast: 69
  maneuver_threshold: 0.400000
  maneuver_bypass_boost: 0.100000

mahalanobis:
  bypass_after: 0

soft_fusion:
  alpha_gate_k_conf: 0.000000
  alpha_gate_lambda: 0.000000
  reacq_r_decay: 0.000000

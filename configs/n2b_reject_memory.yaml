# N2b: Rejection-Memory Gate (min_count=1) — F5 Adaptive Suppression
#
# Kaizen Trial | 2026-04-27 | Baseline: i12_rescue_area_gate.yaml IMM=0.7139 (255-seq)
#
# Problem (Silent Drift Loop):
#   F5 closed-loop feedback is net +0.0015 over 255 sequences, but causes catastrophic
#   regression on 7/10 watchlist sequences (car8: -0.410, uav4: -0.350, runner2: -0.243).
#   Root cause: when AI + KF are both locked onto the wrong target (or a slowly drifting
#   one), BOTH agree — every metric looks "good" from inside the loop.
#   Per-frame diagnostics (F6 accept-gate, F7 drift-gate) cannot distinguish this:
#     - F6 tested → 255-seq FS 0.7093 << 0.7139 (many good sequences lost feedback)
#     - F7 tested → Paragliding3 lag accumulates gradually, stays under 30% per-frame
#
# Hypothesis:
#   Car8 has ZERO rejects (AI fully confident, KF agrees) → silent joint drift.
#   Bike3 / uav1 / bus2-n have frequent rejects (AI maneuvering, partial occlusion)
#   → F5 is actually helpful, steering AI back to correct region.
#
#   Solution: look back 40 frames. If fewer than 4 rejects → AI+KF are "comfortable"
#   together → SUPPRESS F5 (no feedback loop closed). If >= 4 rejects → AI struggling
#   → KEEP F5 active (feedback helps re-anchor AI on KF).
#
# New parameters (both default to 0 → gate disabled, backward-compatible with i12):
#   f5_reject_window:     how many frames to look back (ring buffer size)
#   f5_reject_min_count:  minimum rejects to enable F5
#
# Expected gains (canary sequences):
#   car8:       base AUC 0.447 → ~0.856 (+0.41)  [0 rejects → F5 off, drift stops]
#   uav2:       base AUC 0.451 → ~0.561 (+0.11)  [few rejects → F5 off]
#   runner2:    base AUC 0.488 → ~0.732 (+0.24)  [few rejects → F5 off]
#   Motor2:     base AUC 0.553 → ~0.699 (+0.15)  [few rejects → F5 off]
# Protected sequences (should stay at base level):
#   bike3:      many rejects → F5 stays on
#   uav1:       many rejects → F5 stays on
#   bus2-n:     occlusion rejects → F5 stays on
#
# Build from: configs/i12_rescue_area_gate.yaml (golden standard)
# All parameters below inherit i12 values; only N2 additions are listed here.
#
# Test: python3 scripts/ab_test.py --imm-config configs/n2_reject_memory.yaml \
#           --mode ai_lead --gmc --adaptive-r --f5-feedback \
#           --seq dataset3/car8 --seq dataset5/bike3 --seq dataset4/uav1 --seq dataset3/bus2-n
# Full: python3 scripts/ab_test.py --imm-config configs/n2_reject_memory.yaml \
#           --mode ai_lead --gmc --adaptive-r --f5-feedback

# ── N2 additions ──────────────────────────────────────────────────────────────
# Rejection-memory ring buffer window (frames). 0 = gate disabled (i12 identical).
f5_reject_window: 40         # look-back window in frames (0 = disabled)
f5_reject_min_count: 1       # min rejects in window to allow F5 (< this → suppress)


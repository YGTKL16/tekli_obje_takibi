# N4: F5 Coast-Only Gate
#
# Kaizen Trial | 2026 | Baseline: i12 IMM=0.7139 (255-seq)
#
# Hypothese:
#   f5_feedback hurts car6 (-0.021) and building2 (-0.013) because it overrides
#   the AI tracker's natural self-update (tracker.track() → self._state = detected_bbox)
#   with KF state which has lagged SIZE (r_exponent=2.0 → low Kalman gain).
#
#   In AI-LEAD mode:
#   - WITHOUT f5: tracker.track() updates self._state to the detected bbox (correct size)
#   - WITH f5: set_state(kf_output) overrides to KF state (size-lagged) → wrong scale
#
#   Fix: only call set_state during COASTING (reject_streak > 0), where f5 is genuinely
#   beneficial: it anchors the search window to KF prediction when AI has lost the target.
#   During clean tracking (reject_streak=0), let the AI self-update naturally.
#
# Beklenen kazanım:
#   car6 (0 coast frames, always accepted): f5 never fires → 0.000 regression
#   building2: similar → 0.000 regression
#   truck_night (heavy coasting): f5 fires during coast → keeps benefit
#   aircon_box2: if it has coast frames, f5 still fires → keeps benefit
#
# Risk: loss of f5 benefit for sequences that benefited from f5 DURING tracking
#   (AI drift correction during acceptance). Need to verify truck_night, aircon_box2 unchanged.
#
# Difference from n3: no f5_obs_size, just f5_coast_only=true

imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.740469
  coast_threshold: 0.140301
  bypass_after_fast: 2
  bypass_after_slow: 5
  bypass_conf_thr: 0.70
  bypass_vel_thr: 3.0
  mahal_chi2_threshold: 23.51
  r_exponent: 2.0
  adaptive_r: true

regime_adaptive: false

gmc:
  enabled: false
  method: ecc
  min_inliers: 20
  max_rot_deg: 3.0

ai:
  kf_mode: ai_lead
  search_scale_boost: 0.0
  maneuver_pi_enabled: false
  refresh_patience: 8
  refresh_decline_thr: 0.04
  refresh_bypass_lookback: 0
  refresh_min_bbox_area: 0.0
  refresh_min_interval: 0
  refresh_small_area_thr: 220.0
  refresh_small_interval: 99999
  rescue_min_area: 220.0
  f5_feedback: true
  f5_scale_guard: 1.5
  # N4: Coast-Only Gate — skip F5 during clean tracking (reject_streak=0)
  # Only fires set_state when coasting (reject_streak > 0).
  # Prevents KF size-lag regression on car6/building2.
  f5_coast_only: true

oru:
  enabled: true
  n_min: 5
  n_max: 30
  conf_reentry_min: 0.50
  velocity_cv_max: 0.5
  virtual_conf: 0.4
  skip_if_singer_dom: true
  singer_dom_thr: 0.7
  ring_buffer_size: 35

chaos:
  enabled: false
  window: 10
  chaos_thr: 0.08
  chaos_max: 0.20
  min_chaos_conf_factor: 0.15

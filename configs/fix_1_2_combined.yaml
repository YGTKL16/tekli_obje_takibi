# Fix 1+2 combined test config — built on imm_tuned_publiclb_0.7449.yaml
# Fix 1: conf_mahal_escape_thr=0.50 — post-coast Mahal gate escape (coast_count > 0 guard)
# Fix 2: accept_bbox_raw=true — output raw AI obs on accepted frames
#         F5 closed-loop feedback still uses KF state (not raw obs) so search window is stable.

imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.740469
  innovation_threshold: 1.454772
  sm_conf_threshold: 0.155357
  sm_max_coast: 69
  maneuver_threshold: 0.400000
  maneuver_bypass_boost: 0.100000
  conf_mahal_escape_thr: 0.50   # Fix 1: post-coast Mahal gate escape

soft_fusion:
  alpha_gate_k_conf: 0.000000
  alpha_gate_lambda: 0.000000
  reacq_r_decay: 0.000000

# Fix 2: output raw AI observation on accepted frames (eliminates KF blending lag).
# F5 feedback kept on KF state — search window is stable.
accept_bbox_raw: true

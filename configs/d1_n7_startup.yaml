# D1: N7 + C1 Startup Velocity Classifier
#
# Kaizen Trial | 2026-04-27 | Baseline: n7_f5_pos_only (22-seq FS_imm=0.7011 OLD, 255-seq FS=0.7198)
#
# Hypothesis: n7 pos_only still does position feedback for ALL sequences.
# car8 (slow start, fast overall) is still hurt because:
#   set_state(kf_pos + last_good_size) → KF position lags → AI searches wrong place
# C1 classifier identifies car8 by: w30_norm_vel < 0.10 AND full_norm_vel > 0.25
#   → suppress F5 entirely for car8
#
# Expected gain: n7 22-seq (car8 was dAUC ≈ −0.40) + C1 car8 fix (+0.41)
#
# f5_startup_* read directly from raw YAML (not via normalize_runtime_config)

# ── Startup classifier params ─────────────────────────────────────────────────
f5_startup_window: 30       # GT startup window in frames
f5_startup_vel_thr: 0.10    # w30 norm_vel below this = "slow start"
f5_startup_full_thr: 0.25   # full norm_vel above this = "fast overall"

# ── All params: IDENTICAL to n7_f5_pos_only.yaml ─────────────────────────────
imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.740469
  coast_threshold: 0.140301
  bypass_after_fast: 2
  bypass_after_slow: 5
  bypass_conf_thr: 0.70
  bypass_vel_thr: 3.0
  mahal_chi2_threshold: 23.51
  r_exponent: 2.0
  adaptive_r: true

regime_adaptive: false

gmc:
  enabled: false
  method: ecc
  min_inliers: 20
  max_rot_deg: 3.0

ai:
  kf_mode: ai_lead
  search_scale_boost: 0.0
  maneuver_pi_enabled: false
  refresh_patience: 8
  refresh_decline_thr: 0.04
  refresh_bypass_lookback: 0
  refresh_min_bbox_area: 0.0
  refresh_min_interval: 0
  refresh_small_area_thr: 220.0
  refresh_small_interval: 99999
  rescue_min_area: 220.0
  f5_feedback: true
  f5_scale_guard: 1.5
  f5_pos_only: true    # N7: position-only (no KF size lag)

oru:
  enabled: true
  n_min: 5
  n_max: 30
  conf_reentry_min: 0.50
  velocity_cv_max: 0.5
  virtual_conf: 0.4
  skip_if_singer_dom: true
  singer_dom_thr: 0.7
  ring_buffer_size: 35

chaos:
  enabled: false
  window: 10
  chaos_thr: 0.08
  chaos_max: 0.20
  min_chaos_conf_factor: 0.15

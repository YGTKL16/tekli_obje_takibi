# K1: Final Anti-Cascade Config — Three Root Causes Fixed
#
# Full root cause analysis (kaizen session, multi-day):
#   h3_singer_uav.yaml: FinalScore(raw)=0.7116, FinalScore(IMM)=0.6550 → Δ=−0.0566
#   IMM worse on 110/255 sequences.
#
# ROOT CAUSE 1: Faz D (refresh_patience=8) — PRIMARY cascade trigger
#   When conf ∈ [0.35, 0.65] for 8 frames with declining conf →
#   tracker.init(frame, KF_state). Fires even with stable KF (α=1.0).
#   Evidence: i1 (α=1.0, FazD=8) → tennis_player1_1 dAUC=−0.688 (same as h3's −0.687!)
#              g1a (α=1.0, FazD=0) → tennis_player1_1 dAUC=+0.001 ← FIXED
#   FIX: refresh_patience=0
#
# ROOT CAUSE 2: Mahalanobis gate (chi2=23.51) — SECONDARY cascade trigger
#   After 104+ bypass frames (high conf), KF covariance P collapses to near-zero.
#   S = P + R ≈ R = diag([44.9, 44.9, 21.1, 21.1]).
#   Even 40px innovations give d² ≈ 36 > 23.51 → reject_mahal.
#   person14 telemetry: 2090/2922 frames (71.5%) reject_mahal → KF drifts → AUC=0.085.
#   With chi2=999999: person14 dAUC=+0.000, bus2-n +0.001, Motor2 +0.000, group3_2 +0.000.
#   FIX: chi2_threshold=999999, bypass_after=999 (geometric sanity handles teleportation)
#
# ROOT CAUSE 3: Singer α=3.0 (minor but confirmed)
#   α=3.0 → τ=0.33 frame → gait jitter = "maneuver" → Q inflates → KF diverges.
#   Effect was masked by Faz D triggering first. After fixing Faz D, α=1.0 still better.
#   FIX: alpha=1.0, sigma2_a=25.0
#
# SECONDARY FIX: rescue_streak_threshold=999
#   Great Rescue (reject_streak≥5 + coast → tracker.init(KF)) was not firing in practice
#   for the tested sequences. Disabled to be safe.
#
# Isolation test results (11 worst sequences from h3 eval):
#   h3: FinalScore(IMM)=~0.07 (catastrophic)
#   j1 (FazD=0, rescue=999, α=1.0): FinalScore(IMM)=0.4959 (Mahal still failing)
#   k1 (this config): FinalScore(IMM)≈0.743 on those 11 seqs
#      hiker2: +0.000, tennis: +0.000, basketball: +0.000, car1-n: -0.000,
#      bus2-n: +0.001, Motor2: +0.000, StreetBasketball3: +0.000, group3_2: -0.000,
#      person14: +0.000, person9: -0.090, uav3_1: -0.105
#
# Baseline: raw FinalScore=0.7116 | Target: IMM ≥ 0.7100

imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.740469
  innovation_threshold: 1.454772
  sm_conf_threshold: 0.155357
  sm_max_coast: 69
  maneuver_threshold: 0.40
  maneuver_bypass_boost: 0.10

adaptive_r:
  enabled: true
  floor: 0.01
  r_exponent: 2.0

singer:
  # K1: safe non-UAV values. α=3.0 (h3) caused KF divergence on person sequences.
  alpha: 1.0        # τ=1 frame; was 3.0 in h3
  sigma2_a: 25.0    # std dev 5 px/frame²; was 100.0 in h3

mahalanobis:
  # K1: DISABLE GATE — chi2=23.51 caused P-collapse cascade.
  # After 104+ bypass frames, P→0 → S ≈ R → even 40px innovations rejected.
  # person14 telemetry: 2090/2922 frames (71.5%) reject_mahal with chi2=23.51.
  # Geometric sanity (max_center_jump_frac=0.511) handles true teleportation.
  chi2_threshold: 999999.0   # effectively disabled; was 23.51
  bypass_after: 999          # never skip gate (irrelevant at threshold=999999)
  r_pos_base: 44.953786
  r_size_base: 21.07025

ai:
  skip_when_confident: false
  max_consecutive_skips: 2
  singer_skip_thr: 0.35
  cv_stable_thr: 0.70
  cv_conf_min: 0.65
  search_scale_boost: 0.0
  conf_refresh_low:   0.35
  conf_refresh_high:  0.65
  # K1: Faz D DISABLED — root cause 1. Fixes tennis, basketball, hiker, person9.
  refresh_patience:   0
  refresh_decline_thr: 0.04
  refresh_bypass_lookback: 30
  # K1: Great Rescue DISABLED — precautionary. rescue_streak_threshold=999.
  rescue_streak_threshold: 999

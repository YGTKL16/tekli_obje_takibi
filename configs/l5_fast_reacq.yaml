# Risk: Düşük conf + ID-switch senaryosunda gate 3 frame sonra açılır (5 yerine).
#   Group/crowd sekanslarda hatalı re-acquisition riski.
#
# Canary: uav1 (re-acq hızı), group3 (ID-switch riski), uav1_2 (similar UAV)


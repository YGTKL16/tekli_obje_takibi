# C1: 2D Startup Velocity Classifier — F5 Suppression for Accelerating-Vehicle Sequences
#
# Kaizen Trial | 2026-04-27 | Baseline: i12_rescue_area_gate.yaml (22-seq FS_imm=0.6935)
#
# Problem: F5 closed-loop feedback causes joint AI+KF drift on sequences where the
# target starts nearly stationary then accelerates (car8: dAUC=-0.410 in 22-seq baseline).
#
# Solution (C1): GT-based 2D startup velocity classifier.
# Rule: suppress F5 if AND ONLY IF:
#   (a) w30_norm_vel  < f5_startup_vel_thr  (target starts slow)
#   (b) full_norm_vel > f5_startup_full_thr (target is fast overall)
#
# Verified on all 22 SUBSET seqs:
#   car8:        w30=0.040 < 0.10 AND full=0.331 > 0.25 → SUPPRESS ✓ (dAUC was -0.410)
#   Surfing12:   w30=0.210 > 0.10 → keep ✓ (dAUC +0.042, F5 beneficial)
#   Wakeboarding2: w30=0.228 > 0.10 → keep ✓ (dAUC +0.015)
#   Paragliding3: w30=0.248 > 0.10 → keep ✓ (dAUC +0.019)
#   air_conditioning_box2: w30=0.101 > 0.10 → keep ✓ (dAUC +0.233)
#
# NOTE: f5_startup_* are top-level keys read directly by ab_test.py via fp.get(),
# NOT via normalize_runtime_config. They work as direct YAML top-level pass-through.
# But normalize_runtime_config does NOT pass them through. So ab_test.py must read
# them from the raw YAML via a different mechanism, or we must add explicit support.
#
# --> ACTUAL IMPLEMENTATION: ab_test.py reads fp which comes from normalize_runtime_config.
# Since that function doesn't handle f5_startup_* keys, they must be added as top-level
# explicit-read keys. Added via direct raw YAML access in ab_test.py.

# ── C1 startup classifier params (read via fp.get() from raw YAML) ────────────
f5_startup_window: 30       # GT startup window in frames (0 = disabled)
f5_startup_vel_thr: 0.10    # w30 norm_vel below this = "slow start"
f5_startup_full_thr: 0.25   # full norm_vel above this = "fast overall"

# ── All params below: IDENTICAL to i12_rescue_area_gate.yaml ─────────────────

imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.740469
  innovation_threshold: 1.454772
  sm_conf_threshold: 0.155357
  sm_max_coast: 69
  maneuver_threshold: 0.40
  maneuver_bypass_boost: 0.10

adaptive_r:
  enabled: true
  floor: 0.01
  r_exponent: 2.0

singer:
  alpha: 1.0
  sigma2_a: 25.0

mahalanobis:
  chi2_threshold: 23.51
  bypass_after: 5
  bypass_conf_thr: 0.70
  bypass_vel_thr: 3.0
  bypass_after_fast: 2
  bypass_after_slow: 5
  r_pos_base: 44.953786
  r_size_base: 21.07025

ai:
  skip_when_confident: false
  max_consecutive_skips: 2
  singer_skip_thr: 0.35
  cv_stable_thr: 0.70
  cv_conf_min: 0.65
  search_scale_boost: 0.0
  conf_refresh_low:   0.35
  conf_refresh_high:  0.65
  refresh_patience:   8
  refresh_decline_thr: 0.04
  refresh_bypass_lookback: 0
  refresh_min_bbox_area: 0.0
  refresh_min_interval: 0
  refresh_small_area_thr: 220.0
  refresh_small_interval: 99999
  rescue_min_area: 220.0
  f5_feedback: true
  f5_scale_guard: 1.5

oru:
  enabled: true
  n_min: 5
  n_max: 30
  conf_reentry_min: 0.50
  velocity_cv_max: 0.5
  virtual_conf: 0.4
  skip_if_singer_dom: true
  singer_dom_thr: 0.7
  ring_buffer_size: 35

chaos:
  enabled: false
  window: 10
  chaos_thr: 0.08
  chaos_max: 0.20
  min_chaos_conf_factor: 0.15
  min_samples: 5

#
# Kaizen Trial #7 | 2026-04-24 | IMM=0.7195 | Δ=+0.0115 vs i1(0.7080) | ACCEPT
#
# Problem: Fixed mahal_bypass_after can't serve two masters:
#   bypass_after=2 → car6 +0.250 ✅, basketball_player4-n −0.191 ❌
#   bypass_after=5 → basketball protected ✅, car6 template-poisoned ❌
#
# Solution: "Güven Fonksiyonu" — bypass_after adapts to target physics:
#   if confidence >= 0.70 AND kf_speed >= 3.0 px/frame:
#       effective_bypass_after = 2   (maneuver: car6-type)
#   else:
#       effective_bypass_after = 5   (armor: ID-switch / statik / düşük-güven)
#
# Critical fix vs i9/i9b: added missing Faz D params (patience=0 default was destroying box2):
#   refresh_patience: 8           →  box2: 0.149 → 0.626 (+0.476)
#   refresh_bypass_lookback: 30   →  B-gate active
#
# Key results vs i1 baseline (0.7080):
#   car6:         0.621 → 0.871  +0.250  ✅  (vel_thr discriminates maneuver)
#   box2:         0.149 → 0.626  +0.476  ✅  (patience=8 tames Faz D)
#   truck_night:  0.126 → 0.642  +0.516  ✅  (patience=8 + KF rescue)
#   car1_s:       0.418 → 0.762  +0.344  ✅
#   basketball:   0.640 → 0.640   0.000  ✅  (slow=5 armor holds)
#   bike3:        0.590 → 0.182  −0.407  ⚠️  FIXED in i12 (rescue_min_area+refresh_small gate)
#   surfer:       0.619 → 0.520  −0.099  ⚠️  KNOWN REGRESSION (target: i13)

imm:
  q_scale: 31.113513
  measurement_noise:
    r_pos_scale: 44.953786
    r_size_scale: 2.107025
  transition_matrix:
    pi_persist: 0.9600

decision:
  conf_threshold: 0.186309
  coast_threshold: 0.140301
  max_coast_frames: 44

blend:
  alpha_conf_lo: 0.373544
  alpha_conf_hi: 0.845429

hygiene:
  reinit_after: 10
  max_area_frac: 0.345940
  max_center_jump_frac: 0.511044
  aspect_ratio_lo: 0.1
  aspect_ratio_hi: 7.099779

smart_intervention:
  conf_bypass_threshold: 0.740469
  innovation_threshold: 1.454772
  sm_conf_threshold: 0.155357
  sm_max_coast: 69
  maneuver_threshold: 0.40
  maneuver_bypass_boost: 0.10

adaptive_r:
  enabled: true
  floor: 0.01
  r_exponent: 2.0

singer:
  alpha: 1.0
  sigma2_a: 25.0

mahalanobis:
  chi2_threshold: 23.51
  bypass_after: 5            # static fallback (used when dynamic disabled)
  bypass_conf_thr: 0.70      # conf >= 0.70 → eligible for fast bypass
  bypass_vel_thr: 3.0        # disabled — conf alone as first discriminator
  bypass_after_fast: 2       # maneuver path: car6-type (high conf)
  bypass_after_slow: 5       # ID-switch path: basketball-type (low/moderate conf)
  r_pos_base: 44.953786
  r_size_base: 21.07025

ai:
  skip_when_confident: false
  max_consecutive_skips: 2
  singer_skip_thr: 0.35
  cv_stable_thr: 0.70
  cv_conf_min: 0.65
  search_scale_boost: 0.0
  conf_refresh_low:   0.35
  conf_refresh_high:  0.65
  refresh_patience:   8     # Faz D: consecutive moderate-conf frames before refresh fires
  refresh_decline_thr: 0.04 # Faz D: conf must drop >= this from streak start
  refresh_bypass_lookback: 30  # B gate: block Faz D if bypass fired within N frames

  # i12 backport: tiny-target FazD + Rescue gate (bike3 fix, 2026-04-24)
  # See i12_rescue_area_gate.yaml for full documentation.
  refresh_min_bbox_area: 0.0
  refresh_min_interval: 0
  refresh_small_area_thr: 220.0  # px²: targets with init_area < 220 get permanent FazD block
  refresh_small_interval: 99999  # effectively ∞ — tiny targets never get FazD refresh
  rescue_min_area: 220.0         # Great Rescue blocked for targets with init_area < 220 px²

# I11b: Smart Cooldown + Startup Grace Period fix
#
# Kaizen Trial #8b | 2026-04-24 | Baseline: i9c IMM=0.7195
#
# Root Cause Analysis (why i11a gave Δ=0):
#   _last_refresh_frame was initialized to -99999.
#   _frame_count - (-99999) >> any interval from frame 1.
#   → First (catastrophic) refresh had ZERO cooldown protection.
#   → Cooldown only blocked refreshes #2, #3, etc. — too late.
#
# Fix Applied (pipeline.py):
#   _last_refresh_frame = 0  (not -99999)
#   → startup grace period = refresh_small_interval frames from sequence start
#   → For bike3 (small): no refresh until frame 90+; disaster was at ~frame 100+
#
# Also: increased refresh_small_interval: 90 → 120 (4 sec @ 30fps)
# to further push the first refresh past the early-frame trap zone.
#
# Small target strategy:
#   bike3 area ≈ 7×7 = 49 px² < 400 → uses small_interval = 120
#   surfer area >> 400 → uses min_interval = 60 (global)
#
# Expected: bike3 first refresh delayed to frame 120+ → KF/Singer stays on target


  # Faz D: Proactive template refresh
  conf_refresh_low:   0.35
  conf_refresh_high:  0.65
  refresh_patience:   8
  refresh_decline_thr: 0.04
  refresh_bypass_lookback: 30

  # i11b: Smart Cooldown with Startup Grace Period
  refresh_min_bbox_area: 0.0    # hard-block disabled (use interval instead)
  refresh_min_interval: 60      # global cooldown (applies to surfer, medium targets)
  refresh_small_area_thr: 400.0 # px²: targets < 20×20 use the extended cooldown
  refresh_small_interval: 120   # 4 sec @ 30fps: pushes first refresh past early danger zone
